services:
  svitlolocator:
    build:
      context: .
      dockerfile: Dockerfile
    image: svitlolocator:latest
    container_name: svitlolocator
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - traefik-public
      - internal-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      
      - "traefik.http.routers.svitlolocator.rule=Host(`svitlo-finder.xyz`) || Host(`www.svitlo-finder.xyz`)"
      - "traefik.http.routers.svitlolocator.entrypoints=websecure"
      - "traefik.http.routers.svitlolocator.tls=true"
      - "traefik.http.routers.svitlolocator.tls.certresolver=myresolver"

      - "traefik.http.services.svitlolocator.loadbalancer.server.port=8082"

  redis:
    image: redis:alpine
    container_name: svitlolocator_redis
    restart: unless-stopped
    networks:
      - internal-net

  overpass:
    image: wiktorn/overpass-api:latest
    container_name: local_overpass
    ports:
      - "12345:80"
    volumes:
      - overpass-db:/db
    healthcheck:
      disable: true
    environment:
      - OVERPASS_MODE=init
      # Стабільне посилання на OSM екстракт Києва (BBBike)
      - OVERPASS_PLANET_URL=https://download.bbbike.org/osm/bbbike/Kiew/Kiew.osm.pbf
      # Препроцесинг для конвертації PBF у формат OSM BZ2 за допомогою osmium
      - OVERPASS_PLANET_PREPROCESS=mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf && chmod -R 777 /db
      # Вимикаємо оновлення метаданих
      - OVERPASS_META=no
    restart: always
    networks:
      - traefik-public
      - internal-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.overpass.rule=(Host(`svitlo-finder.xyz`) || Host(`www.svitlo-finder.xyz`)) && PathPrefix(`/overpass`)"
      - "traefik.http.routers.overpass.priority=100"
      - "traefik.http.routers.overpass.entrypoints=websecure"
      - "traefik.http.routers.overpass.tls=true"
      - "traefik.http.routers.overpass.tls.certresolver=myresolver"
      - "traefik.http.middlewares.overpass-stripprefix.stripprefix.prefixes=/overpass"
      - "traefik.http.routers.overpass.middlewares=overpass-stripprefix"
      - "traefik.http.services.overpass.loadbalancer.server.port=80"

  osrm:
    image: osrm/osrm-backend:latest
    container_name: local_osrm
    volumes:
      - osrm-data:/data
    entrypoint: >
      /bin/sh -c "
      if [ ! -f /data/Kiew.osrm ]; then
        echo 'Preparing dependencies...' &&
        (which wget || (apt-get update && apt-get install -y wget)) &&
        echo 'Downloading Kiew.osm.pbf...' &&
        mkdir -p /data &&
        wget -O /data/Kiew.osm.pbf https://download.bbbike.org/osm/bbbike/Kiew/Kiew.osm.pbf &&
        echo 'Extracting footprint profile...' &&
        osrm-extract -p /usr/local/share/osrm/profiles/foot.lua /data/Kiew.osm.pbf &&
        echo 'Partitioning...' &&
        osrm-partition /data/Kiew.osrm &&
        echo 'Customizing...' &&
        osrm-customize /data/Kiew.osrm &&
        echo 'Cleaning up PBF...' &&
        rm /data/Kiew.osm.pbf;
      fi;
      echo 'Starting OSRM foot router...' &&
      exec osrm-routed --algorithm mld /data/Kiew.osrm
      "
    restart: always
    networks:
      - traefik-public
      - internal-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.osrm.rule=(Host(`svitlo-finder.xyz`) || Host(`www.svitlo-finder.xyz`)) && PathPrefix(`/osrm`)"
      - "traefik.http.routers.osrm.priority=100"
      - "traefik.http.routers.osrm.entrypoints=websecure"
      - "traefik.http.routers.osrm.tls=true"
      - "traefik.http.routers.osrm.tls.certresolver=myresolver"
      - "traefik.http.middlewares.osrm-stripprefix.stripprefix.prefixes=/osrm"
      - "traefik.http.routers.osrm.middlewares=osrm-stripprefix"
      - "traefik.http.services.osrm.loadbalancer.server.port=5000"

volumes:
  overpass-db:
  osrm-data:

networks:
  traefik-public:
    external: true
  internal-net: