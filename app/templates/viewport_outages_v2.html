<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моніторинг відключень світла v2 (Прогресивний)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-orange: #f97316;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-gray: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }

        /* Dark Theme Leaflet Customization */
        .leaflet-container {
            background: #0f172a !important;
        }
        .leaflet-bar {
            border: 1px solid var(--border-color) !important;
            box-shadow: none !important;
        }
        .leaflet-bar a {
            background-color: rgba(30, 41, 59, 0.9) !important;
            color: var(--text-primary) !important;
            border-bottom: 1px solid var(--border-color) !important;
        }
        .leaflet-bar a:hover {
            background-color: rgba(51, 65, 85, 0.9) !important;
        }
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.95) !important;
        }

        /* Custom UI overlays */
        .overlay-panel {
            position: absolute;
            z-index: 10;
            backdrop-filter: blur(12px);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        #stats-panel {
            top: 20px;
            left: 20px;
            width: 320px;
            pointer-events: auto;
        }

        #log-panel {
            bottom: 20px;
            left: 20px;
            width: 380px;
            max-height: 220px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }

        #control-panel {
            top: 20px;
            right: 20px;
            pointer-events: auto;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Connection state dot */
        .conn-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-gray);
            box-shadow: 0 0 8px var(--accent-gray);
        }
        .conn-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }
        .conn-dot.connecting {
            background-color: var(--accent-blue);
            box-shadow: 0 0 8px var(--accent-blue);
        }
        .conn-dot.disconnected {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .stats-grid {
            display: grid;
            grid-template-cols: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .stat-val {
            font-size: 24px;
            font-weight: 700;
            margin-top: 4px;
        }
        .stat-val.on { color: var(--accent-orange); }
        .stat-val.off { color: #6b7280; }

        .stat-lbl {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Log console */
        .log-console {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #38bdf8;
            max-height: 140px;
        }

        .log-line {
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .zoom-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--accent-orange);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            max-width: 400px;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            display: none;
        }

        .zoom-alert h3 {
            font-size: 18px;
            color: var(--accent-orange);
            margin-bottom: 8px;
        }

        .zoom-alert p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .zoom-alert button {
            background: var(--accent-orange);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Stats & Progress Panel -->
    <div id="stats-panel" class="overlay-panel">
        <div class="panel-header">
            <span class="panel-title" id="status-title-text">Готовий</span>
            <div class="conn-badge">
                <span id="conn-text">З'єднання...</span>
                <div id="conn-dot" class="conn-dot connecting"></div>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-lbl">Світло Є</div>
                <div class="stat-val on" id="stat-on">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-lbl">Немає світла</div>
                <div class="stat-val off" id="stat-off">0</div>
            </div>
        </div>
        
        <div style="font-size: 12px; color: var(--text-secondary);" id="progress-lbl">
            Будівель на карті: <span id="stat-total" style="color: var(--text-primary); font-weight: 600;">0</span>
        </div>
    </div>

    <!-- Console Logs Panel -->
    <div id="log-panel" class="overlay-panel">
        <div class="panel-header">
            <span class="panel-title" style="font-size: 12px; color: var(--text-secondary);">Термінал оновлень</span>
            <button class="btn" style="padding: 2px 6px; font-size: 9px;" onclick="document.getElementById('status-log').innerHTML=''">Очистити</button>
        </div>
        <div class="log-console" id="status-log"></div>
    </div>

    <!-- Controls Panel -->
    <div id="control-panel" class="overlay-panel">
        <button class="btn" onclick="clearViewportCache()">Очистити Кеш Viewport</button>
    </div>

    <!-- Zoom warning -->
    <div class="zoom-alert" id="zoom-alert">
        <h3>Приблизьте карту</h3>
        <p>Для відображення статусів будинків необхідно наблизити карту на рівень вулиці.</p>
        <button onclick="map.setZoom(16)">Наблизити</button>
    </div>

    <script>
        // Init Leaflet with Canvas Renderer for maximum speed
        const map = L.map('map', {
            center: [50.4501, 30.5234], // Kyiv Maidan
            zoom: 16,
            zoomControl: false,
            preferCanvas: true // Render all building shapes in canvas
        });

        L.control.zoom({ position: 'topright' }).addTo(map);

        // Add CartoDB Dark Matter map layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // State tracking variables
        const MIN_ZOOM = 15;
        let ws = null;
        
        let renderedBuildingIds = new Set();
        let renderedPolygons = {}; // Map of building ID -> Leaflet polygon instance
        let buildingsByStreet = {}; // Street -> Array of building elements
        
        // Cache resolved address statuses
        let resolvedStatuses = {}; // "street||house" -> status
        let streetStatuses = {};   // street -> Array of { houseNum, status }
        
        // Bounding box cache to prevent redundant fetching
        let queriedBboxCache = [];

        const zoomAlert = document.getElementById('zoom-alert');
        const connText = document.getElementById('conn-text');
        const connDot = document.getElementById('conn-dot');
        const logBox = document.getElementById('status-log');
        const statusText = document.getElementById('status-title-text');

        function addLogItem(message) {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = `[${timeStr}] ${message}`;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setConnectionState(state, text) {
            connText.textContent = text;
            connDot.className = 'conn-dot ' + state;
        }

        function parseHouseNum(str) {
            const match = str.match(/\d+/);
            return match ? parseInt(match[0], 10) : 0;
        }

        // Check if Bounding Box A is fully contained inside Bounding Box B
        function isBboxContained(child, parent) {
            return child.getSouth() >= parent.getSouth() &&
                   child.getNorth() <= parent.getNorth() &&
                   child.getWest() >= parent.getWest() &&
                   child.getEast() <= parent.getEast();
        }

        function clearViewportCache() {
            queriedBboxCache = [];
            renderedBuildingIds.clear();
            buildingsByStreet = {};
            resolvedStatuses = {};
            streetStatuses = {};
            
            // Remove all existing polygons
            for (let id in renderedPolygons) {
                map.removeLayer(renderedPolygons[id]);
            }
            renderedPolygons = {};
            
            updateStatsUI();
            addLogItem('Кеш переглядів та будівлі очищено.');
            handleMapChange();
        }

        function updateStatsUI() {
            let countOn = 0;
            let countOff = 0;
            
            // Recount stats from rendered polygons
            for (let id in renderedPolygons) {
                const poly = renderedPolygons[id];
                if (poly.options.status === 'ON') countOn++;
                else if (poly.options.status === 'OFF' || poly.options.status === 'EMERGENCY') countOff++;
            }
            
            document.getElementById('stat-on').textContent = countOn;
            document.getElementById('stat-off').textContent = countOff;
            document.getElementById('stat-total').textContent = renderedBuildingIds.size;
        }

        // Establish WebSocket Connection
        function connectWebSocket() {
            setConnectionState('connecting', 'З\'єднання...');
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/v2/ws/outages`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                setConnectionState('connected', 'Підключено');
                addLogItem('Канал зв\'язку з сервером встановлено.');
                handleMapChange();
            };

            ws.onclose = () => {
                setConnectionState('disconnected', 'Відключено');
                addLogItem('Канал зв\'язку закрито. Повторна спроба через 3 сек...');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket Error:', err);
                ws.close();
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.type === 'status_update') {
                    // Update cache with the resolved status
                    const key = `${msg.street}||${msg.house}`;
                    resolvedStatuses[key] = msg.status;
                    
                    if (!streetStatuses[msg.street]) {
                        streetStatuses[msg.street] = [];
                    }
                    
                    // Prevent duplicate street status entries
                    const existingIdx = streetStatuses[msg.street].findIndex(item => item.houseStr === msg.house);
                    const newEntry = {
                        houseStr: msg.house,
                        houseNum: parseHouseNum(msg.house),
                        status: msg.status,
                        reason: msg.reason
                    };
                    
                    if (existingIdx !== -1) {
                        streetStatuses[msg.street][existingIdx] = newEntry;
                    } else {
                        streetStatuses[msg.street].push(newEntry);
                    }
                    
                    addLogItem(`Адреса вирішена: ${msg.street}, ${msg.house} -> ${msg.status}`);
                    
                    // Propagate/extrapolate and color the buildings on this street
                    updateStreetBuildings(msg.street);
                } 
                else if (msg.type === 'error') {
                    addLogItem(`Помилка сервера: ${msg.message}`);
                }
            };
        }

        // Extrapolate and render/update color for all buildings on a specific street
        function updateStreetBuildings(street) {
            const streetElements = buildingsByStreet[street] || [];
            const resolvedList = streetStatuses[street] || [];
            
            // Filter only valid resolved statuses
            const validResolved = resolvedList.filter(s => s.status !== 'UNKNOWN');
            const listToUse = validResolved.length > 0 ? validResolved : resolvedList;
            
            if (listToUse.length === 0) return;

            streetElements.forEach(b => {
                const house = b.tags['addr:housenumber'];
                const key = `${street}||${house}`;
                
                let status = 'UNKNOWN';
                let reason = 'Немає даних';
                let mappingType = 'unknown';

                if (resolvedStatuses[key] && resolvedStatuses[key] !== 'UNKNOWN') {
                    status = resolvedStatuses[key];
                    reason = listToUse.find(item => item.houseStr === house)?.reason || 'Пряма відповідність';
                    mappingType = 'direct';
                } else {
                    // Propagate closest status
                    const targetNum = parseHouseNum(house);
                    let minDiff = Infinity;
                    let bestStatus = 'UNKNOWN';
                    let bestReason = '';
                    
                    listToUse.forEach(item => {
                        const diff = Math.abs(item.houseNum - targetNum);
                        if (diff < minDiff) {
                            minDiff = diff;
                            bestStatus = item.status;
                            bestReason = item.reason;
                        }
                    });
                    status = bestStatus;
                    reason = bestReason;
                    mappingType = 'propagated';
                }

                // Determine styling colors
                let color = '#4b5563'; // Grey
                let fillColor = '#4b5563';
                let fillOpacity = 0.4;

                if (status === 'ON') {
                    color = '#ea580c'; // Orange
                    fillColor = '#f97316';
                    fillOpacity = 0.85;
                } else if (status === 'OFF' || status === 'EMERGENCY') {
                    color = '#1e293b'; // Slate Dark
                    fillColor = '#0f172a';
                    fillOpacity = 0.95;
                }

                // Check if polygon is already drawn
                if (renderedPolygons[b.id]) {
                    // Update style of existing polygon
                    renderedPolygons[b.id].setStyle({
                        color: color,
                        fillColor: fillColor,
                        fillOpacity: fillOpacity
                    });
                    // Update stored status option for recount stats
                    renderedPolygons[b.id].options.status = status;
                } else {
                    // Draw new polygon
                    const coordinates = b.geometry.map(pt => [pt.lat, pt.lon]);
                    const poly = L.polygon(coordinates, {
                        color: color,
                        weight: 1,
                        fillColor: fillColor,
                        fillOpacity: fillOpacity,
                        status: status // Custom property
                    }).addTo(map);
                    
                    renderedPolygons[b.id] = poly;
                }

                // Update popup contents
                const statusLabel = status === 'ON' ? 'СВІТЛО Є' : (status === 'UNKNOWN' ? 'Невідомо' : 'НЕМАЄ СВІТЛА');
                const mappingLabel = mappingType === 'direct' ? 'Прямий запит' : 'Екстрапольовано з вулиці';

                renderedPolygons[b.id].bindPopup(`
                    <div style="font-size: 12px; line-height: 1.4;">
                        <div style="font-weight: 700; margin-bottom: 4px; color: ${status === 'ON' ? '#fb923c' : '#f3f4f6'};">
                            ${street}, ${house}
                        </div>
                        <div style="color: #9ca3af; font-size: 11px;">
                            Статус: <strong>${statusLabel}</strong>
                        </div>
                        <div style="color: #6b7280; font-size: 10px; margin-top: 2px;">
                            Джерело: ${mappingLabel}
                        </div>
                        <div style="color: #4b5563; font-size: 9px; margin-top: 1px;">
                            Деталі: ${reason}
                        </div>
                    </div>
                `);
            });

            updateStatsUI();
        }

        // Query Overpass directly from the client browser
        async function fetchOverpassData(query) {
            const instances = [
                'https://overpass-api.de/api/interpreter',
                'https://overpass.kumi.systems/api/interpreter',
                'https://overpass.osm.ch/api/interpreter'
            ];
            
            let lastError = null;
            for (const instance of instances) {
                try {
                    addLogItem(`Запит до Overpass (${new URL(instance).hostname})...`);
                    const url = `${instance}?data=${encodeURIComponent(query)}`;
                    const response = await fetch(url);
                    if (response.ok) {
                        return await response.json();
                    }
                    lastError = new Error(`Overpass returned status ${response.status}`);
                } catch (err) {
                    lastError = err;
                }
            }
            throw lastError || new Error("Failed to fetch data from all Overpass API instances.");
        }

        // Handle Map view shifts (panning/zooming)
        async function handleMapChange() {
            const zoom = map.getZoom();
            
            if (zoom < MIN_ZOOM) {
                zoomAlert.style.display = 'block';
                return;
            }
            zoomAlert.style.display = 'none';

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            const currentBounds = map.getBounds();

            // 1. Redundant Fetch Check: Skip if viewport is already fully contained inside previously queried zones
            const alreadyCached = queriedBboxCache.some(parentBounds => isBboxContained(currentBounds, parentBounds));
            if (alreadyCached) {
                addLogItem('Viewport вже закешовано. Пропуск запиту.');
                return;
            }

            // Expand queried bounding box cache slightly to reduce future fetches on minor pans
            const expandedBounds = currentBounds.pad(0.1); 
            queriedBboxCache.push(expandedBounds);

            const south = currentBounds.getSouth();
            const west = currentBounds.getWest();
            const north = currentBounds.getNorth();
            const east = currentBounds.getEast();

            statusText.textContent = 'Сканування екрану...';
            addLogItem('Пошук нових контурів будинків у полі зору...');

            try {
                // Fetch geometries directly from browser IP (bypassing VPS 406/504 errors!)
                const query = `[out:json];way(${south},${west},${north},${east})["addr:housenumber"]["addr:street"];out geom;`;
                const data = await fetchOverpassData(query);
                const elements = data.elements || [];

                // Filter new buildings
                const newBuildings = elements.filter(el => !renderedBuildingIds.has(el.id));
                addLogItem(`Знайдено ${elements.length} будівель (Нових для завантаження: ${newBuildings.length}).`);

                if (newBuildings.length === 0) {
                    statusText.textContent = 'Готовий';
                    return;
                }

                // Add to street cache and mark as rendered (drawn as gray initially)
                newBuildings.forEach(b => {
                    renderedBuildingIds.add(b.id);
                    const street = b.tags['addr:street'];
                    if (!buildingsByStreet[street]) {
                        buildingsByStreet[street] = [];
                    }
                    buildingsByStreet[street].push(b);
                    
                    // Render initially as gray
                    const coordinates = b.geometry.map(pt => [pt.lat, pt.lon]);
                    const poly = L.polygon(coordinates, {
                        color: '#4b5563',
                        weight: 1,
                        fillColor: '#4b5563',
                        fillOpacity: 0.4,
                        status: 'UNKNOWN'
                    }).addTo(map);
                    
                    renderedPolygons[b.id] = poly;
                });

                // Group new buildings by street to find representative houses to query
                const streetQueryMap = {};
                newBuildings.forEach(b => {
                    const street = b.tags['addr:street'];
                    if (!streetQueryMap[street]) {
                        streetQueryMap[street] = [];
                    }
                    streetQueryMap[street].push(b);
                });

                const uniqueToQuery = [];
                const queriedKeys = new Set();

                for (const street in streetQueryMap) {
                    const streetBuildings = streetQueryMap[street];
                    let count = 0;
                    for (const b of streetBuildings) {
                        const house = b.tags['addr:housenumber'];
                        const key = `${street}||${house}`;
                        if (!queriedKeys.has(key)) {
                            queriedKeys.add(key);
                            uniqueToQuery.push({ street, house });
                            count++;
                            if (count >= 3) break;
                        }
                    }
                }

                if (uniqueToQuery.length === 0) {
                    statusText.textContent = 'Готовий';
                    return;
                }

                // Query address statuses progressively via WebSockets
                statusText.textContent = 'Опитування статусів...';
                addLogItem(`Надсилання запиту на опитування ${uniqueToQuery.length} адрес...`);
                
                ws.send(JSON.stringify({
                    action: "resolve_statuses",
                    addresses: uniqueToQuery
                }));

            } catch (err) {
                console.error(err);
                statusText.textContent = 'Помилка';
                addLogItem(`Помилка під час сканування: ${err.message}`);
            }
        }

        // Register event listeners
        map.on('moveend', handleMapChange);

        // Start App
        connectWebSocket();
    </script>
</body>
</html>
